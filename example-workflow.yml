# Example workflow — drop this in any repo as .github/workflows/pr-triage.yml
#
# It runs automatically when a PR is opened or pushed to, on demand via a
# "/triage" comment, and manually from the Actions tab.
#
# Requires: a public repo (free Actions minutes), or adjust for private.
# For Dart/Flutter repos, the flutter setup step below enables the test gate.

name: PR Triage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    # auto runs on PR events; /triage comment command for on-demand
    if: >-
      github.event_name != 'issue_comment' ||
      startsWith(github.event.comment.body, '/triage')
    runs-on: ubuntu-latest
    steps:
      # Test-gate support for Flutter/Dart repos — remove or replace for other
      # ecosystems (the engine auto-detects npm / pytest / make otherwise).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gmgm60/pr-triage@main
        with:
          pr: ${{ github.event.inputs.pr || '' }}
          full: 'true'
